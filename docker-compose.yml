services:
  postgres:
    image: postgres:16-alpine
    container_name: aralau-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-aralau}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aralau}
      POSTGRES_DB: ${DB_NAME:-aralau}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-aralau} -d ${DB_NAME:-aralau}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
